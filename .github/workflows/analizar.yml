name: BOT-ARQ V5 - Analisis y publicacion validada

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Actualizar analisis fuera de horario (NUNCA permite operar fuera de sesión)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [main]
    paths:
      - ".github/workflows/analizar.yml"
      - "analizador_acciones.py"
      - "index.html"
      - "script.js"
      - "style.css"
      - "requirements.txt"
      - "config/**"
      - "engine/**"
      - "backtest/**"
      - "execution/**"
      - "tests/**"
      - "scripts/**"

permissions:
  contents: read

# Keep this group stable across deployment to serialize with the previous version.
concurrency:
  group: arq-v4-4-1-auto-update
  cancel-in-progress: false

jobs:
  analizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sin credenciales persistentes ni historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Dependencias fijadas
        run: python -m pip install -r requirements.txt

      - name: Pruebas antes de tocar estado
        run: |
          python -m pytest
          node --check script.js
          node tests/frontend.test.cjs

      - name: Ventana de analisis
        id: window
        env:
          FORCE_ANALYSIS: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from engine.policy import market_session, timestamp
          now = datetime.now(timezone.utc)
          session = market_session(now)
          close = session["market_close"]
          final_mark = close and 0 <= (now - timestamp(close)).total_seconds() <= 1200
          run = session["is_open"] or final_mark or os.environ["FORCE_ANALYSIS"] == "true" or os.environ["EVENT_NAME"] == "push"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
          print(session)
          PY

      - name: Analizar con bloqueo de sesión dentro del motor
        if: steps.window.outputs.run == 'true'
        run: python analizador_acciones.py

      - name: Validar snapshot antes de publicar
        if: steps.window.outputs.run == 'true'
        run: python scripts/validate_snapshot.py

      - name: Publicar estado sin sobrescribir cambios concurrentes
        if: steps.window.outputs.run == 'true'
        env:
          ARQ_PUSH_TOKEN: ${{ secrets.ARQ_PAT }}
        run: |
          set -euo pipefail
          test -n "$ARQ_PUSH_TOKEN"
          BASE_SHA=$(git rev-parse HEAD)
          # Public read, no token persisted. If main changed, discard this run rather than rebase stale state.
          git fetch --depth=1 https://github.com/${{ github.repository }}.git main
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git add datos_acciones.json historial_senales.json paper/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "BOT-ARQ"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar snapshot BOT-ARQ V5"
          AUTH=$(printf 'x-access-token:%s' "$ARQ_PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push https://github.com/${{ github.repository }}.git HEAD:main
